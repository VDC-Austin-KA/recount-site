name: Deploy recount.ackerworks.com

# Every push to main redeploys the site.
# Needs two repository secrets, both copyable from the ackworks repo settings:
#   CLOUDFLARE_API_TOKEN   - token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  - account ID from the Cloudflare dashboard sidebar
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
